# Resume Genie - Development Profile Configuration
# Profile: dev
spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGODB_URI}}
      database: ${MONGODB_DATABASE:resumegenie}

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.skydevx.resumegenie: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"

app:
  environment: dev
  verification:
    required: ${EMAIL_VERIFICATION_REQUIRED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000,http://localhost:5173,http://127.0.0.1:8081,http://127.0.0.1:19006,http://192.168.1.7:8081,exp://192.168.1.7:8081}
