# Resume Genie - Production Profile Configuration
# Profile: prod
spring:
  config:
    activate:
      on-profile: prod
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:resumegenie}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:noreply@skydevx.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          from: ${SPRING_MAIL_FROM:noreply@skydevx.com}
    protocol: smtps

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    root: WARN
    com.skydevx.resumegenie: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  environment: prod
  client:
    url: ${APP_BASE_URL:https://resumebuilderapp-jux7.onrender.com}
  backend:
    url: ${BACKEND_BASE_URL:https://resumebuilderapp-jux7.onrender.com}
  verification:
    required: ${EMAIL_VERIFICATION_REQUIRED:false} # Email verification disabled by default - instant access
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Cloudinary Storage Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# Resend API Configuration
resend:
  api-key: ${RESEND_API_KEY:}
