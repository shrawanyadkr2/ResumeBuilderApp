spring:
  main:
    banner-mode: off
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  mail:
    host: localhost
    port: 2525
    username: test_user
    password: test_password
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          from: test@skydevx.com

app:
  environment: test
  verification:
    required: true
  cors:
    allowed-origins: http://localhost:8081

jwt:
  secret: testSecretKeyForUnitAndIntegrationTestingMustBeAtLeast32BytesLong!
  expiration: 86400000

cloudinary:
  cloud-name: test-cloud
  api-key: test-api-key
  api-secret: test-api-secret

razorpay:
  key:
    id: rzp_test_sampleKeyId
    secret: sampleSecretKeyForTesting12345678
  webhook:
    secret: sampleWebhookSecretForTesting12345
  plus-plan-amount: 49900
